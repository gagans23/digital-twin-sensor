[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "digital-twin-sensor"
version = "0.1.0"
description = "Privacy-first local attention sensor and Digital Twin Signature prototype inspired by X-SYNTH."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Local prototype" }]
dependencies = []

# Judgement-based evaluation only. Developer-time, never required at runtime:
# the sensor itself must stay installable with zero dependencies, because a
# privacy tool a security team cannot read end to end is not a privacy tool.
# Needs Python >=3.11 (deepagents), while the sensor supports >=3.9.
[project.optional-dependencies]
deep-eval = ["deepagents>=0.7.11"]
# Encryption at rest for the local ledger. Optional so the default install
# stays dependency-free; opting in is an explicit, reversible choice.
encrypted = ["cryptography>=42", "keyring>=24"]
# Deeper property testing. The committed tests run on the standard library
# alone so CI needs nothing extra; this buys shrinking and a smarter search
# when hunting a specific evasion locally.
fuzz = ["hypothesis>=6"]

[project.scripts]
digital-twin-sensor = "digital_twin_sensor.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["digital_twin_sensor*"]

[tool.setuptools.package-data]
digital_twin_sensor = ["ui_static/*"]
