name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip && pip install -e .
      - run: python -m unittest discover -s tests
      - run: python -m compileall digital_twin_sensor
      # A longer soak than the in-suite default, so CI explores inputs the
      # committed seed does not reach.
      - run: FUZZ_ITERATIONS=5000 python -m unittest tests.test_fuzz_leak_gate

  context_harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip && pip install -e .
      # Non-zero exit on any leakage canary reaching an export, or if mean
      # recall falls below the floor. Context regressions break the build.
      # Two gates. The floor catches a system that is bad now; the baseline
      # catches one getting worse while still above the floor — including a
      # gate that quietly stops denying while recall improves.
      - run: digital-twin-sensor harness --format markdown --baseline harness/baseline.json --output harness-report.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harness-report
          path: harness-report.md
