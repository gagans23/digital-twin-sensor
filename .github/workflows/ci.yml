name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip && pip install -e .
      - run: python -m unittest discover -s tests
      - run: python -m compileall digital_twin_sensor

  context_harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip && pip install -e .
      # Non-zero exit on any leakage canary reaching an export, or if mean
      # recall falls below the floor. Context regressions break the build.
      - run: digital-twin-sensor harness --format markdown --output harness-report.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harness-report
          path: harness-report.md
