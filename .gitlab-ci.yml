stages:
  - test

unit_tests:
  image: python:3.11-slim
  stage: test
  script:
    - python -m pip install --upgrade pip
    - python -m pip install -e ".[encrypted]"
    - python -m unittest discover -s tests
    - python -m compileall digital_twin_sensor
    # Longer soak than the in-suite default, so CI explores inputs the
    # committed seed does not reach.
    - FUZZ_ITERATIONS=5000 python -m unittest tests.test_fuzz_leak_gate

dashboard_ui:
  image: node:22-slim
  stage: test
  script:
    - node --check digital_twin_sensor/ui_static/app.js
    - node --test tests/dashboard_ui.test.cjs

package_smoke:
  image: python:3.11-slim
  stage: test
  script:
    - python -m pip install --upgrade pip build
    - python -m build
    - python -m pip install dist/*.whl
    - cd /tmp
    - python "$CI_PROJECT_DIR/scripts/check_installed_package.py"
  artifacts:
    when: always
    paths:
      - dist/
    expire_in: 7 days

context_harness:
  image: python:3.11-slim
  stage: test
  script:
    - python -m pip install --upgrade pip
    - python -m pip install -e .
    # Exits non-zero on any leakage canary reaching an export, or if mean
    # recall drops below the floor. A context regression should break the
    # build the same way a failing unit test does.
    # Two gates. The floor catches a system that is bad now; the baseline
    # catches one getting worse while still above the floor — including a gate
    # that quietly stops denying while recall improves.
    - digital-twin-sensor harness --format markdown --baseline harness/baseline.json --output harness-report.md
  artifacts:
    when: always
    paths:
      - harness-report.md
    expire_in: 30 days
