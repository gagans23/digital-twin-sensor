# Local tracing UI only. No remote origins, embeddings, or browser telemetry.
map $http_host $dts_host_allowed {
    default 0;
    "127.0.0.1:5173" 1;
    "localhost:5173" 1;
}
map $http_origin $dts_origin_allowed {
    default 0;
    "" 1;
    "http://127.0.0.1:5173" 1;
    "http://localhost:5173" 1;
}
resolver 127.0.0.11 valid=30s;
upstream backend {
    zone backend 64k;
    server backend:8080 resolve;
    keepalive 16;
}
server {
    listen 5173 default_server;
    server_name localhost 127.0.0.1;
    if ($dts_host_allowed = 0) { return 403; }
    if ($dts_origin_allowed = 0) { return 403; }
    if ($http_sec_fetch_site = "cross-site") { return 403; }
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 16m;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data: blob:; font-src 'self' data:; worker-src 'self' blob:; frame-ancestors 'none'; form-action 'self'; base-uri 'self'" always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    location /health { access_log off; return 200 "healthy\n"; }
    location /api/ {
        proxy_pass http://backend/;
        proxy_set_header Host $host;
        proxy_read_timeout 30;
        proxy_connect_timeout 5;
    }
    location / { try_files $uri $uri/ /index.html; }
}
